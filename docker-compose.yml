services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # A replica set (even single-node) is required for change streams,
    # which the engine uses to react to config updates.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - >
        mongosh --host mongo:27017 --quiet --eval '
        try { rs.status(); } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
        '

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeeva
      POSTGRES_PASSWORD: jeeva
      POSTGRES_DB: jeeva
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jeeva"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    environment:
      DATABASE_URL: postgres://jeeva:jeeva@timescaledb:5432/jeeva
    entrypoint: ["npm", "run", "migrate", "up"]
    depends_on:
      timescaledb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    environment:
      - PORT=4000
      - MONGO_URL=mongodb://mongo:27017/jeeva
      - DATABASE_URL=postgres://jeeva:jeeva@timescaledb:5432/jeeva
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-change-me}
      # Bare names (no value) pass these through from .env only when set
      # there, so the decision-maker status endpoint can see whether
      # they're configured without the engine's own confusion between
      # "unset" and "empty string".
      - PAPER_TRADING_ONLY
      - TYPESAFE_API_KEY
      - TYPESAFE_BASE_URL
      - OPENROUTER_API_KEY
      - OPENROUTER_BASE_URL
    ports:
      - "4000:4000"
    volumes:
      - ./api/src:/repo/api/src
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile.dev
    environment:
      - MONGO_URL=mongodb://mongo:27017/jeeva
      - DATABASE_URL=postgres://jeeva:jeeva@timescaledb:5432/jeeva
      # Bare names (no value) pass these through from .env only when set
      # there; unlike `VAR=${VAR:-}`, an unset var is left out of the
      # container entirely instead of becoming an empty string, which the
      # engine would otherwise misread as "configured".
      - TYPESAFE_API_KEY
      - TYPESAFE_BASE_URL
      - OPENROUTER_API_KEY
      - OPENROUTER_BASE_URL
      - HYPERLIQUID_PRIVATE_KEY
      - HYPERLIQUID_TESTNET
    volumes:
      - ./engine/src:/app/src
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/repo/frontend/src
    depends_on:
      - api

volumes:
  mongo_data:
  timescale_data:
