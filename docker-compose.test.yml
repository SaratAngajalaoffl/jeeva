services:
  mongo:
    image: mongo:7
    # A replica set (even single-node) is required for change streams,
    # which the engine's tests exercise directly against this container.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - >
        mongosh --host mongo:27017 --quiet --eval '
        try { rs.status(); } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }
        '

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: jeeva
      POSTGRES_PASSWORD: jeeva
      POSTGRES_DB: jeeva
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5432:5432"
