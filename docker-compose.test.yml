services:
  mongo:
    image: mongo:7
    tmpfs:
      - /data/db
    ports:
      - "27017:27017"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: jeeva
      POSTGRES_PASSWORD: jeeva
      POSTGRES_DB: jeeva
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5432:5432"
