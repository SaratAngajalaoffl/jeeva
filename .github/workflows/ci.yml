name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
            api:
              - 'api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - '.prettierrc.json'

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: jeeva
          POSTGRES_PASSWORD: jeeva
          POSTGRES_DB: jeeva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install API deps and run Postgres migrations
        working-directory: .
        run: |
          npm ci --workspace=api --include-workspace-root
          npm run migrate up --workspace=api
        env:
          DATABASE_URL: postgres://jeeva:jeeva@localhost:5432/jeeva_test
      - name: Start a single-node MongoDB replica set
        # Change streams (used by the config watcher) require a replica
        # set, which GitHub's declarative `services:` block can't
        # initiate on its own, so this is started and initiated by hand.
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ] && break
            sleep 1
          done
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          TEST_MONGO_URL: mongodb://localhost:27017
          TEST_DATABASE_URL: postgres://jeeva:jeeva@localhost:5432/jeeva_test
      - name: Stop MongoDB
        if: always()
        run: docker rm -f mongo

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: jeeva
          POSTGRES_PASSWORD: jeeva
          POSTGRES_DB: jeeva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=api
      - run: npm run build --workspace=api
      - run: npm run migrate up --workspace=api
        env:
          DATABASE_URL: postgres://jeeva:jeeva@localhost:5432/jeeva_test
      - run: npm run test --workspace=api
        env:
          TEST_MONGO_URL: mongodb://localhost:27017/jeeva_test
          TEST_DATABASE_URL: postgres://jeeva:jeeva@localhost:5432/jeeva_test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=frontend
      - run: npm run test --workspace=frontend
      - run: npm run build --workspace=frontend
